name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke (server loop, throwaway DB)
        run: npm run smoke

      - name: Smoke: LLM pipeline (fake model server, no API key)
        run: npm run smoke:llm

      - name: Production build
        run: npm run build
